<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=IBM+Plex+Mono:wght@600&display=swap");
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background:
          radial-gradient(1200px 700px at 78% 18%, __ACCENT__22 0%, transparent 60%),
          linear-gradient(145deg, __CANVAS_BG__ 0%, __CANVAS_BG2__ 100%);
        color: __TEXT_PRIMARY__;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(__GRID__ 1px, transparent 1px),
          linear-gradient(90deg, __GRID__ 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.35; pointer-events: none;
      }
      .top { display: flex; align-items: center; justify-content: space-between; z-index: 2; }
      .brand {
        font-family: "IBM Plex Mono", monospace;
        font-size: 24px; letter-spacing: 8px; font-weight: 600;
        color: __ACCENT__; text-transform: uppercase;
      }
      .badge {
        font-family: "IBM Plex Mono", monospace;
        font-size: 24px; font-weight: 600; letter-spacing: 3px;
        padding: 12px 26px; border-radius: 999px;
        background: __ACCENT__; color: __ON_ACCENT__;
        text-transform: uppercase;
      }
      .headline {
        z-index: 2;
        font-size: 128px; font-weight: 800; line-height: 0.98;
        letter-spacing: -2px; max-width: 1000px;
        text-transform: uppercase;
        text-shadow: __TEXT_SHADOW__;
      }
      .headline .hl { color: __ACCENT__; }
      .rule { height: 10px; width: 220px; background: __ACCENT__; border-radius: 6px; z-index: 2; }
      .foot {
        z-index: 2; display: flex; align-items: center; gap: 20px;
        font-family: "IBM Plex Mono", monospace; font-size: 26px; color: __TEXT_MUTED__;
      }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: __ACCENT_2__; box-shadow: 0 0 18px __ACCENT_2__; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="top">
      <div class="brand">__CHANNEL_NAME__</div>
      <div class="badge">__BADGE_TEXT__</div>
    </div>
    <div>
      <div class="rule"></div>
      <div class="headline" style="margin-top: 28px">__HEADLINE_HTML__</div>
    </div>
    <div class="foot"><span class="dot"></span> __GENRE_LABEL__</div>
  </body>
</html>
