name: Render video

# ---------------------------------------------------------------------------
# Free "render farm" for omni-video-studio.
#
# Remotion rendering is CPU + headless-Chrome heavy and runs for minutes, which
# is exactly what a GitHub Actions runner is good at (and free: unlimited on a
# public repo, 2,000 min/month on a private one).
#
# HOW TO RENDER
#   1. Author a video the normal way (web studio or `main.py --manual-prompt`)
#      until you have the model's JSON for one video.
#   2. Save that JSON as `render-jobs/<name>.json` and push it.
#   3. This workflow runs the real pipeline (voiceover -> music -> B-roll ->
#      Remotion) with Telegram + YouTube skipped, and uploads the finished
#      `final_video.mp4` as a downloadable build artifact.
#
# Trigger it from the Actions tab (Run workflow) to pick a specific payload,
# or just push a file under render-jobs/ to render the default one.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      payload_path:
        description: "Path to the render payload JSON (committed in the repo)"
        default: "render-jobs/payload.json"
        required: true
      format:
        description: "Video format (auto = read video_format from the payload)"
        type: choice
        options: [auto, landscape, portrait]
        default: auto
  push:
    paths:
      - "render-jobs/**.json"

# One render at a time per branch; don't cancel a render in flight.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # contents: write lets the delivery step publish a GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve payload + format
        id: job
        shell: bash
        run: |
          PAYLOAD="${{ github.event.inputs.payload_path }}"
          [ -z "$PAYLOAD" ] && PAYLOAD="render-jobs/payload.json"
          if [ ! -f "$PAYLOAD" ]; then
            echo "::error::Payload not found: $PAYLOAD"
            echo "Available payloads under render-jobs/:"
            ls -1 render-jobs/*.json 2>/dev/null || echo "  (none)"
            exit 1
          fi
          FMT="${{ github.event.inputs.format }}"
          if [ -z "$FMT" ] || [ "$FMT" = "auto" ]; then
            FMT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('video_format','landscape'))" "$PAYLOAD")
          fi
          # Collapse whitespace so the title is a safe single-line output value.
          TITLE=$(python3 -c "import json,sys;t=json.load(open(sys.argv[1])).get('youtube_title','Omni video');print(' '.join(str(t).split()))" "$PAYLOAD")
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "format=$FMT" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Rendering **$PAYLOAD** as **$FMT** — $TITLE" >> "$GITHUB_STEP_SUMMARY"

      - name: System deps (ffmpeg + headless-Chrome libs for Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-engine/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-backend/requirements.txt

      - name: Install backend deps (core only — no local-ML extras)
        run: pip install -r agent-backend/requirements.txt

      - name: Install Remotion deps
        working-directory: video-engine
        run: npm ci

      - name: Pre-download Remotion's headless browser
        working-directory: video-engine
        run: npx remotion browser ensure

      - name: Render the video
        working-directory: agent-backend
        env:
          # Keep CI deterministic / fully offline-safe for the publish side.
          BACKGROUND_MUSIC_ENABLED: "true"
        run: |
          python main.py \
            --payload "${{ github.workspace }}/${{ steps.job.outputs.payload }}" \
            --format "${{ steps.job.outputs.format }}" \
            --dry-run --skip-approval

      - name: Upload rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-video
          path: |
            agent-backend/output/final_video.mp4
            agent-backend/output/thumbnail.png
          if-no-files-found: warn
          retention-days: 14

      # --- Delivery: a permanent Release link + a push to Telegram ----------
      - name: Publish GitHub Release
        id: release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.job.outputs.title }}
          PAYLOAD: ${{ steps.job.outputs.payload }}
          FMT: ${{ steps.job.outputs.format }}
        run: |
          VID=agent-backend/output/final_video.mp4
          if [ ! -f "$VID" ]; then
            echo "No video rendered; skipping release."
            exit 0
          fi
          ASSETS="$VID"
          [ -f agent-backend/output/thumbnail.png ] && ASSETS="$ASSETS agent-backend/output/thumbnail.png"
          TAG="render-${{ github.run_number }}.${{ github.run_attempt }}"
          URL=$(gh release create "$TAG" $ASSETS \
            --title "$TITLE" \
            --notes "Rendered from \`$PAYLOAD\` ($FMT) — run #${{ github.run_number }}.")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Release: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ steps.job.outputs.title }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram not configured (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets); skipping."
            exit 0
          fi
          VID=agent-backend/output/final_video.mp4
          if [ ! -f "$VID" ]; then
            echo "No video; skipping Telegram."
            exit 0
          fi
          CAP="🎬 ${TITLE}"
          [ -n "$RELEASE_URL" ] && CAP="${CAP}"$'\n'"${RELEASE_URL}"
          SIZE=$(stat -c%s "$VID")
          # Telegram bot uploads cap at 50MB — send inline when it fits, else the link.
          if [ "$SIZE" -lt 49000000 ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendVideo" \
              -F chat_id="$TG_CHAT" -F supports_streaming=true \
              -F caption="$CAP" -F video=@"$VID" -o /dev/null \
              && echo "Sent video to Telegram."
          else
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -F chat_id="$TG_CHAT" \
              -F text="${CAP}"$'\n'"(video is >50MB — download it from the release link above)" -o /dev/null \
              && echo "Sent release link to Telegram."
          fi
